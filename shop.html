<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOX Store</title>

<link rel="icon" type="image/png" href="assets/favicon.png">

<style>

/* ---------- GLOBAL ---------- */

body{
margin:0;
font-family:Arial, sans-serif;
background:#060014;
color:white;
}

/* ---------- NAVBAR ---------- */

.navbar{
display:flex;
align-items:center;
justify-content:center;

padding:15px;

background:black;

border-bottom:2px solid #7a00ff;

position:fixed;
width:100%;
top:0;
z-index:100;
}

.logo{

position:absolute;
left:20px;

top:50%;
transform:translateY(-50%);

height:40px;

}

.nav-links{
display:flex;
gap:40px;

list-style:none;

margin:0;
padding:0;
}

.nav-links a{
text-decoration:none;
color:white;
font-size:16px;
transition:.3s;
}

.nav-links a:hover{
color:#a64dff;
text-shadow:0 0 10px #7a00ff;
}

/* ---------- ICONS ---------- */

.nav-icons{
display:flex;
gap:20px;
}

.icon-btn{
color:white;
cursor:pointer;
transition:.25s;
}

.icon-btn:hover{
color:#7a00ff;
transform:scale(1.1);
filter:drop-shadow(0 0 6px #7a00ff);
}

/* ---------- TITLE ---------- */

.section-title{
text-align:center;
font-size:40px;
margin-top:80px;
text-shadow:0 0 12px #7a00ff;
}

/* ---------- SHOP GRID ---------- */

.shop-grid{
max-width:1200px;
margin:60px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:35px;
padding:20px;
}

/* ---------- PRODUCT CARD ---------- */

.shop-card{
padding:22px;
border-radius:18px;
border:2px solid #7a00ff;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(10px);
text-align:center;
transition:.25s;
}

.shop-card:hover{
transform:translateY(-8px) scale(1.02);
box-shadow:0 0 25px #7a00ff,0 0 60px rgba(122,0,255,0.5);
}

/* ---------- PRODUCT IMAGE ---------- */

.shop-card img{
width:100%;
border-radius:10px;
margin-bottom:14px;
}

/* ---------- ADD TO CART BUTTON ---------- */

.add-btn{
margin-top:10px;
padding:10px 20px;
border:none;
background:#7a00ff;
color:white;
border-radius:8px;
cursor:pointer;
transition:.25s;
}

.add-btn:hover{
box-shadow:0 0 12px #7a00ff;
}

/* ---------- CART POPUP ---------- */

.cart-popup{
position:fixed;
right:20px;
top:80px;
width:300px;
background:#0b001c;
border:2px solid #7a00ff;
border-radius:12px;
padding:15px;
display:none;
z-index:999;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:6px 0;
}

/* ---------- CHECKOUT ---------- */

.checkout{
margin-top:10px;
padding:10px;
width:100%;
border:none;
background:#7a00ff;
color:white;
border-radius:8px;
cursor:pointer;
}
/* VIDEO BACKGROUND */

#bg-video{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

z-index:-2;

}

/* DARK OVERLAY */

body::after{

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.65);

z-index:-1;

}

</style>
</head>

<body>
<video autoplay muted loop id="bg-video">
  <source src="assets/background.mp4" type="video/mp4">
</video>

<!-- NAVBAR -->

<nav class="navbar">

<a href="index.html" class="logo-link">
<img src="assets/logo.png" class="logo">
</a>

<ul class="nav-links">

<li><a href="about">About.</a></li>
<li><a href="watch.html">Watch</a></li>
<li><a href="tournaments.html">Tournaments</a></li>
<li><a href="signup.html">Signup</a></li>
<li><a href="news.html">News</a></li>
<li><a href="creators.html">Creators</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="home.html">test</a></li>

<div class="nav-right">

</div>

</nav>
<div class="icon-btn" onclick="toggleCart()">

<svg viewBox="0 0 24 24" width="26">
<circle cx="9" cy="21" r="1.5"/>
<circle cx="17" cy="21" r="1.5"/>
<path d="M2 3h3l3 12h10l3-8H6"
fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

</div>

</div>

</div>


<h1 class="section-title">NOX Store</h1>

<!-- SHOP GRID -->

<div class="shop-grid">

<div class="shop-card">
<img src="assets/store/hoodie.png">
<h3>NOX Hoodie</h3>
<p>€35</p>
<button class="add-btn" onclick="addToCart('NOX Hoodie',60)">Add to Cart</button>
</div>

<div class="shop-card">
<img src="assets/store/jersey.png">
<h3>Team Jersey</h3>
<p>€75</p>
<button class="add-btn" onclick="addToCart('Team Jersey',75)">Add to Cart</button>
</div>

<div class="shop-card">
<img src="assets/store/mousepad.png">
<h3>Gaming Mousepad</h3>
<p>€15</p>
<button class="add-btn" onclick="addToCart('Mousepad',15)">Add to Cart</button>
</div>

<div class="shop-card">
<img src="assets/store/cap.png">
<h3>Cap</h3>
<p>€7</p>
<button class="add-btn" onclick="addToCart('Cap',7)">Add to Cart</button>
</div>

</div>


<!-- CART POPUP -->

<div class="cart-popup" id="cart">

<h3>Your Cart</h3>

<div id="cart-items"></div>

<hr>

<p>Total: $<span id="total">0</span></p>

<button class="checkout" onclick="checkout()">Checkout</button>

</div>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price){

cart.push({name,price});
localStorage.setItem("cart",JSON.stringify(cart));

updateCart();

}

function updateCart(){

let items = document.getElementById("cart-items");
let total = 0;

items.innerHTML="";

cart.forEach(item=>{

items.innerHTML +=
`<div class="cart-item">
${item.name}
<span>$${item.price}</span>
</div>`;

total += item.price;

});

document.getElementById("total").innerText = total;

}

function toggleCart(){

let cartBox = document.getElementById("cart");

cartBox.style.display =
cartBox.style.display === "block" ? "none" : "block";

updateCart();

}

function checkout(){

alert("Checkout system coming soon!");

}

</script>

</body>
</html>
