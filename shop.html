<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOX Store</title>

<style>

/* ---------- GLOBAL ---------- */

body{
margin:0;
font-family:Arial, sans-serif;
background:#060014;
color:white;
}

/* ---------- NAVBAR ---------- */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
border-bottom:2px solid #7a00ff;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
}

.nav-links a{
margin:0 18px;
text-decoration:none;
color:white;
}

.nav-links a:hover{
color:#7a00ff;
}

/* ---------- ICONS ---------- */

.nav-icons{
display:flex;
gap:20px;
}

.icon-btn{
color:white;
cursor:pointer;
transition:.25s;
}

.icon-btn:hover{
color:#7a00ff;
transform:scale(1.1);
filter:drop-shadow(0 0 6px #7a00ff);
}

/* ---------- TITLE ---------- */

.section-title{
text-align:center;
font-size:40px;
margin-top:80px;
text-shadow:0 0 12px #7a00ff;
}

/* ---------- SHOP GRID ---------- */

.shop-grid{
max-width:1200px;
margin:60px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:35px;
padding:20px;
}

/* ---------- PRODUCT CARD ---------- */

.shop-card{
padding:22px;
border-radius:18px;
border:2px solid #7a00ff;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(10px);
text-align:center;
transition:.25s;
}

.shop-card:hover{
transform:translateY(-8px) scale(1.02);
box-shadow:0 0 25px #7a00ff,0 0 60px rgba(122,0,255,0.5);
}

/* ---------- PRODUCT IMAGE ---------- */

.shop-card img{
width:100%;
border-radius:10px;
margin-bottom:14px;
}

/* ---------- ADD TO CART BUTTON ---------- */

.add-btn{
margin-top:10px;
padding:10px 20px;
border:none;
background:#7a00ff;
color:white;
border-radius:8px;
cursor:pointer;
transition:.25s;
}

.add-btn:hover{
box-shadow:0 0 12px #7a00ff;
}

/* ---------- CART POPUP ---------- */

.cart-popup{
position:fixed;
right:20px;
top:80px;
width:300px;
background:#0b001c;
border:2px solid #7a00ff;
border-radius:12px;
padding:15px;
display:none;
z-index:999;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:6px 0;
}

/* ---------- CHECKOUT ---------- */

.checkout{
margin-top:10px;
padding:10px;
width:100%;
border:none;
background:#7a00ff;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div>NOX</div>

<div class="nav-links">
<a href="/">Home</a>
<a href="/shop">Shop</a>
</div>

<div class="nav-icons">

<div class="icon-btn" onclick="toggleCart()">

<svg viewBox="0 0 24 24" width="26">
<circle cx="9" cy="21" r="1.5"/>
<circle cx="17" cy="21" r="1.5"/>
<path d="M2 3h3l3 12h10l3-8H6"
fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

</div>

</div>

</div>


<h1 class="section-title">NOX Store</h1>

<!-- SHOP GRID -->

<div class="shop-grid">

<div class="shop-card">
<img src="assets/store/hoodie.png">
<h3>NOX Hoodie</h3>
<p>$60</p>
<button class="add-btn" onclick="addToCart('NOX Hoodie',60)">Add to Cart</button>
</div>

<div class="shop-card">
<img src="assets/store/jersey.png">
<h3>Team Jersey</h3>
<p>$75</p>
<button class="add-btn" onclick="addToCart('Team Jersey',75)">Add to Cart</button>
</div>

<div class="shop-card">
<img src="assets/store/mousepad.png">
<h3>Gaming Mousepad</h3>
<p>$25</p>
<button class="add-btn" onclick="addToCart('Mousepad',25)">Add to Cart</button>
</div>

<div class="shop-card">
<img src="assets/store/stickers.png">
<h3>Sticker Pack</h3>
<p>$10</p>
<button class="add-btn" onclick="addToCart('Sticker Pack',10)">Add to Cart</button>
</div>

</div>


<!-- CART POPUP -->

<div class="cart-popup" id="cart">

<h3>Your Cart</h3>

<div id="cart-items"></div>

<hr>

<p>Total: $<span id="total">0</span></p>

<button class="checkout" onclick="checkout()">Checkout</button>

</div>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price){

cart.push({name,price});
localStorage.setItem("cart",JSON.stringify(cart));

updateCart();

}

function updateCart(){

let items = document.getElementById("cart-items");
let total = 0;

items.innerHTML="";

cart.forEach(item=>{

items.innerHTML +=
`<div class="cart-item">
${item.name}
<span>$${item.price}</span>
</div>`;

total += item.price;

});

document.getElementById("total").innerText = total;

}

function toggleCart(){

let cartBox = document.getElementById("cart");

cartBox.style.display =
cartBox.style.display === "block" ? "none" : "block";

updateCart();

}

function checkout(){

alert("Checkout system coming soon!");

}

</script>

</body>
</html>
