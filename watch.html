<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Watch NOX</title>

<style>

/* PAGE */

body{
margin:0;
font-family:Arial;
background:#050008;
color:white;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
align-items:center;

padding:18px;

background:black;

border-bottom:2px solid #7a00ff;
}

.logo{
position:absolute;
left:20px;
height:40px;
}

/* HERO */

.hero{

text-align:center;

padding:120px 20px 60px;

}

.hero h1{

font-size:52px;

text-shadow:0 0 20px #7a00ff;

}

/* SECTION */

.section{

max-width:1200px;

margin:auto;

padding:80px 20px;

}

/* TITLES */

.section h2{

text-align:center;

font-size:36px;

margin-bottom:40px;

text-shadow:0 0 15px #7a00ff;

}

/* GRID */

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:30px;

}

/* GLASS PANEL */

.panel{

background:rgba(0,0,0,0.4);

border:2px solid #7a00ff;

border-radius:14px;

padding:20px;

backdrop-filter:blur(10px);

transition:.3s;

}

.panel:hover{

transform:translateY(-6px);

box-shadow:
0 0 20px #7a00ff,
0 0 60px rgba(122,0,255,0.5);

}

/* VIDEOS */

video,
iframe{

width:100%;

border-radius:10px;

}

/* PLAYER NAME */

.stream-name{

text-align:center;

margin-bottom:12px;

font-size:20px;

}

/* LIVE BADGE */

.live{

background:red;

padding:3px 10px;

border-radius:6px;

font-size:12px;

margin-left:10px;

}

/* FOOTER */

footer{

text-align:center;

padding:40px;

border-top:2px solid #7a00ff;

margin-top:80px;

}

</style>

</head>
