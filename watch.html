<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Watch NOX</title>

<link rel="icon" type="image/png" href="assets/favicon.png">

<link rel="stylesheet" href="styles/styles.css">

<style>

/* PAGE */

.watch-page{
padding-top:140px;
text-align:center;
}

/* TITLE */

.watch-title{
font-size:60px;
text-shadow:0 0 25px #7a00ff;
margin-bottom:40px;
}

/* FEATURED VIDEO */

.featured-video{
max-width:900px;
margin:0 auto 70px auto;

background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);

border:2px solid #7a00ff;
border-radius:16px;

padding:20px;
}

.featured-video video{
width:100%;
border-radius:12px;
}

/* GRID */

.clip-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;

max-width:1100px;
margin:auto;
}

/* CLIP CARD */

.clip-card{

background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);

border:2px solid #7a00ff;
border-radius:16px;

padding:15px;

transition:.3s;
}

.clip-card video{
width:100%;
border-radius:12px;
margin-bottom:10px;
}

/* TEXT */

.clip-card h3{
margin:5px 0;
font-size:18px;
}

.clip-card p{
font-size:14px;
color:#bbb;
}

/* HOVER EFFECT */

.clip-card:hover{
transform:translateY(-8px);

box-shadow:
0 0 20px #7a00ff,
0 0 60px #7a00ff;
}
/* VIDEO BACKGROUND */

.video-background{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

z-index:-2;

overflow:hidden;

}

/* VIDEO */

.video-background video{

width:100%;
height:100%;

object-fit:cover;

filter:brightness(.35);

}

/* OVERLAY */

.video-background::after{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:linear-gradient(
rgba(10,0,20,.7),
rgba(0,0,0,.9)
);

}
/* LOADER SCREEN */

#loader{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#050008;

display:flex;
justify-content:center;
align-items:center;

z-index:9999;

transition:opacity .6s ease;

}

/* LOGO ANIMATION */

.loader-logo{

width:120px;

animation:logoPulse 2s infinite ease-in-out;

}

/* PULSE EFFECT */

@keyframes logoPulse{

0%{
transform:scale(1);
filter:drop-shadow(0 0 10px #7a00ff);
}

50%{
transform:scale(1.1);
filter:drop-shadow(0 0 25px #7a00ff);
}

100%{
transform:scale(1);
filter:drop-shadow(0 0 10px #7a00ff);
}

}
/* CUSTOM CURSOR */

.cursor{

position:fixed;

width:18px;
height:18px;

border-radius:50%;

background:#7a00ff;

box-shadow:
0 0 10px #7a00ff,
0 0 25px #7a00ff;

pointer-events:none;

transform:translate(-50%, -50%);

z-index:999;

}
/* LIVE SECTION */

.live-section{
max-width:1100px;
margin:80px auto;
}

.section-title{
font-size:32px;
margin-bottom:20px;
text-shadow:0 0 15px #7a00ff;
}

.live-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.live-card{
background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);

border:2px solid #7a00ff;
border-radius:16px;

padding:15px;
transition:.3s;
}

.live-card:hover{
transform:translateY(-6px);
box-shadow:0 0 25px #7a00ff;
}
.clip-card button{

margin-top:10px;
padding:8px 14px;

background:#7a00ff;
border:none;
border-radius:8px;

color:white;
cursor:pointer;

transition:.3s;
}

.clip-card button:hover{
background:#9d2bff;
box-shadow:0 0 10px #7a00ff;
}
.clip-actions{
display:flex;
gap:10px;
margin-top:10px;
}

.clip-actions button{

flex:1;
padding:8px;

border:none;
border-radius:10px;

background:rgba(122,0,255,0.2);
color:white;

cursor:pointer;

transition:.3s;
}

/* HOVER EFFECT */
.clip-actions button:hover{

background:#7a00ff;

box-shadow:
0 0 10px #7a00ff,
0 0 25px #7a00ff;

transform:scale(1.05);
}
.comment-box{
margin-top:10px;
}

.comment-box input{
width:100%;
padding:6px;
border-radius:6px;
border:none;
margin-bottom:5px;
}

.comment{
font-size:12px;
color:#ccc;
text-align:left;
margin-top:4px;
}
.comment-box{
margin-top:10px;
text-align:left;
}

.comment-box input{
width:100%;
padding:6px;
border-radius:6px;
border:none;
margin-bottom:5px;
}

.comment{
font-size:12px;
color:#ccc;
margin-top:4px;
}

.clip-actions{
display:flex;
gap:10px;
margin-top:10px;
}

.clip-actions button{
flex:1;
padding:8px;
border:none;
border-radius:10px;
background:rgba(122,0,255,0.2);
color:white;
cursor:pointer;
}

.clip-actions button:hover{
background:#7a00ff;
}
video{
max-width:100%;
display:block;
}

body > video{
display:none; /* kills any stray videos */
}
</style>

</head>

<section class="watch-page">

<h1 class="watch-title">NOX Highlights</h1>


<!-- FEATURED VIDEO -->

<div class="featured-video">

<video controls>
<source src="assets/clips/featured.mp4" type="video/mp4">
</video>

<h3>Featured Highlight</h3>
<p>Best NOX HERO Play of the Week</p>

</div>
</section>


<!-- CLIP GRID -->


<div class="clip-grid" id="clip-container"></div>


</section>
<script>

// 🚫 BANNED WORDS LIST
const bannedWords = ["pedo","nigga2","nigger"]

let clips = JSON.parse(localStorage.getItem("noxClips"))

if(!clips){
clips = [
{
url:"assets/clips/clip1.mp4",
thumb:"assets/clips/thumb1.png",
title:"NO AIM",
player:"RAEANNE",
likes:0,
views:0,
comments:[]
},
{
url:"assets/clips/clip2.mp4",
thumb:"assets/clips/thumb2.png",
title:"EASY ACE",
player:"SHY",
likes:0,
views:0,
comments:[]
}
]
save()
}

const container = document.getElementById("clip-container")

function save(){
localStorage.setItem("noxClips", JSON.stringify(clips))
}

// ❤️ LIKE
function likeClip(i){
clips[i].likes++
save()
render()
}

// 👁️ VIEW
function addView(i){
clips[i].views++
save()
render()
}

// 🚫 CHECK BANNED WORDS
function containsBanned(text){
return bannedWords.some(word => 
text.toLowerCase().includes(word)
)
}

// 💬 COMMENT
function addComment(i){

const input = document.getElementById("comment-"+i)
const text = input.value.trim()

if(!text) return

if(containsBanned(text)){
alert("🚫 Comment contains banned words")
return
}

clips[i].comments.push(text)
input.value = ""

save()
render()
}

// 🎬 RENDER
function render(){

container.innerHTML = ""

clips.forEach((clip, i) => {

clip.likes = clip.likes || 0
clip.views = clip.views || 0
clip.comments = clip.comments || []

const card = document.createElement("div")
card.className = "clip-card"

card.innerHTML = `

<video controls poster="${clip.thumb}" onclick="addView(${i})">
<source src="${clip.url}">
</video>

<h3>${clip.title}</h3>
<p>Player: ${clip.player}</p>

<div class="clip-actions">
<button onclick="addView(${i})">👁️ ${clip.views}</button>
<button onclick="likeClip(${i})">❤️ ${clip.likes}</button>
</div>

<div class="comment-box">
<input id="comment-${i}" placeholder="Add comment...">
<button onclick="addComment(${i})">Post</button>

${clip.comments.map(c => `<div class="comment">💬 ${c}</div>`).join("")}
</div>

`

container.appendChild(card)

})

}

render()

</script>




<script src="scripts/main.js"></script>
</body>
